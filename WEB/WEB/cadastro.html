<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboLab — Criar Conta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar" style="border-bottom: none;">
    <div class="topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-icon">≡</span>
        <span>Área de acesso</span>
      </a>
    </div>
  </header>

  <main class="container" style="display: grid; place-items: center;">
    <article class="card" style="width: 100%; max-width: 420px; padding: 2rem;">
      <div style="width: 38px; height: 38px; border-radius: 8px; background: var(--purple-pill); display: grid; place-items: center; margin-bottom: 1rem; color: #3b0764; font-weight: bold;">👤+</div>
      <h1 style="font-size: 1.5rem; margin-bottom: 0.25rem;">Crie sua conta</h1>
      <p class="robot-subtitle" style="margin-bottom: 1.5rem;">Que bom ter você por aqui. Vamos começar?</p>

      <form action="index.html">
        <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;" for="nome">Nome completo</label>
        <input id="nome" type="text" placeholder="Como você se chama?" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #86efac; border-radius: 8px; margin-bottom: 1rem;">

        <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;" for="email">E-mail</label>
        <input id="email" type="email" placeholder="voce@exemplo.com" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #86efac; border-radius: 8px; margin-bottom: 1rem;">

        <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;" for="senha">Senha</label>
        <input id="senha" type="password" placeholder="Crie uma senha" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #86efac; border-radius: 8px; margin-bottom: 0.3rem;">
        <span style="display: block; font-size: 0.72rem; color: var(--text-muted-light); margin-bottom: 1rem;">Use pelo menos 8 caracteres, letras e números.</span>

        <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;" for="confirmar-senha">Confirmar senha</label>
        <input id="confirmar-senha" type="password" placeholder="Digite a senha novamente" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #86efac; border-radius: 8px; margin-bottom: 1rem;">

        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--text-muted-light); margin-bottom: 1.25rem; cursor: pointer;">
          <input type="checkbox" style="accent-color: var(--purple-main);">
          <span>Li e aceito os <a href="#" class="link-action">Termos de uso</a> e a <a href="#" class="link-action">Política de Privacidade</a>.</span>
        </label>

        <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; text-align: center; padding: 0.75rem;">Criar conta →</button>
      </form>

      <hr style="border: none; border-top: 1px solid var(--border-light); margin: 1.25rem 0;">

      <p class="robot-subtitle" style="text-align: center;">
        Já tem uma conta? <a href="login.html" class="link-action">Entrar</a>
      </p>
    </article>

    <p style="font-size: 0.75rem; color: var(--text-muted-dark); margin-top: 1.25rem; text-align: center;">
      🛡️ Seu acesso, com segurança e privacidade.
    </p>
  </main>
</body>
</html>
