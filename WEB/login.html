<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboLab — Área de Acesso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar" style="border-bottom: none;">
    <div class="topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-icon">≡</span>
        <span>Área de acesso</span>
      </a>
    </div>
  </header>

  <main class="container" style="display: grid; place-items: center;">
    <article class="card" style="width: 100%; max-width: 400px; padding: 2rem;">
      <div style="width: 38px; height: 38px; border-radius: 8px; background: var(--purple-pill); display: grid; place-items: center; margin-bottom: 1rem; color: #3b0764; font-weight: bold;">🔒</div>
      <h1 style="font-size: 1.5rem; margin-bottom: 0.25rem;">Bem-vindo de volta</h1>
      <p class="robot-subtitle" style="margin-bottom: 1.5rem;">Entre na sua conta para continuar.</p>

      <form action="index.html">
        <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;" for="email">E-mail</label>
        <input id="email" type="email" placeholder="voce@exemplo.com" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #86efac; border-radius: 8px; margin-bottom: 1rem;">

        <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.35rem;" for="senha">Senha</label>
        <input id="senha" type="password" placeholder="Digite sua senha" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid #86efac; border-radius: 8px; margin-bottom: 1rem;">

        <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; text-align: center; padding: 0.75rem;">Entrar →</button>
      </form>

      <p class="robot-subtitle" style="text-align: center; margin-top: 1.25rem;">
        <a href="index.html" class="link-action">← Voltar para o Painel de Controle</a>
      </p>
    </article>
  </main>
</body>
</html>
