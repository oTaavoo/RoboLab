<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboLab — Criar Conta</title>
  <link rel="stylesheet" href="css/comum.css">
  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body class="pagina-cadastro">
  <header class="barra-superior sem-borda-inferior">
    <div class="conteudo-barra-superior">
      <a href="index.html" class="marca">
        <span class="icone-marca">≡</span>
        <span>Área de acesso</span>
      </a>
    </div>
  </header>

  <main class="conteiner">
    <article class="cartao cartao-acesso">
      <div class="icone-acesso">👤+</div>
      <h1 class="titulo-acesso">Crie sua conta</h1>
      <p class="subtitulo-robo descricao-acesso">Que bom ter você por aqui. Vamos começar?</p>

      <form action="index.html">
        <label class="rotulo-campo" for="nome">Nome completo</label>
        <input class="campo-acesso" id="nome" type="text" placeholder="Como você se chama?">

        <label class="rotulo-campo" for="email">E-mail</label>
        <input class="campo-acesso" id="email" type="email" placeholder="voce@exemplo.com">

        <label class="rotulo-campo" for="senha">Senha</label>
        <input class="campo-acesso senha-acesso" id="senha" type="password" placeholder="Crie uma senha">
        <span class="ajuda-senha">Use pelo menos 8 caracteres, letras e números.</span>

        <label class="rotulo-campo" for="confirmar-senha">Confirmar senha</label>
        <input class="campo-acesso" id="confirmar-senha" type="password" placeholder="Digite a senha novamente">

        <label class="termos-acesso">
          <input type="checkbox">
          <span>Li e aceito os <a href="#" class="link-acao">Termos de uso</a> e a <a href="#" class="link-acao">Política de Privacidade</a>.</span>
        </label>

        <button type="submit" class="botao-principal botao-acesso">Criar conta →</button>
      </form>

      <hr class="separador-acesso">

      <p class="subtitulo-robo texto-centralizado">
        Já tem uma conta? <a href="login.html" class="link-acao">Entrar</a>
      </p>
    </article>

    <p class="nota-privacidade">
      🛡️ Seu acesso, com segurança e privacidade.
    </p>
  </main>
</body>
</html>
