<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboLab — Área de Acesso</title>
  <link rel="stylesheet" href="css/comum.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="pagina-login">
  <header class="barra-superior sem-borda-inferior">
    <div class="conteudo-barra-superior">
      <a href="index.html" class="marca">
        <span class="icone-marca">≡</span>
        <span>Área de acesso</span>
      </a>
    </div>
  </header>

  <main class="conteiner">
    <article class="cartao cartao-acesso">
      <div class="icone-acesso">🔒</div>
      <h1 class="titulo-acesso">Bem-vindo de volta</h1>
      <p class="subtitulo-robo descricao-acesso">Entre na sua conta para continuar.</p>

      <form action="index.html">
        <label class="rotulo-campo" for="email">E-mail</label>
        <input class="campo-acesso" id="email" type="email" placeholder="voce@exemplo.com">

        <label class="rotulo-campo" for="senha">Senha</label>
        <input class="campo-acesso" id="senha" type="password" placeholder="Digite sua senha">

        <button type="submit" class="botao-principal botao-acesso">Entrar →</button>
      </form>

      <p class="subtitulo-robo retorno-acesso">
        <a href="index.html" class="link-acao">← Voltar para o Painel de Controle</a>
      </p>
    </article>
  </main>
</body>
</html>
